name: synthpet_mcp
description: >-
  The SynthPet MCP daemon: an out-of-process Model Context Protocol server
  that gives the app's companion filesystem and shell tools without the app
  itself needing to leave the App Sandbox.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

dependencies:
  mcp_server: ^2.2.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
